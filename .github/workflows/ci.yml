name: CI

# Runs the JVM unit tests and a beta build (manual start only while disabled, see below).
# It uses no secrets and publishes nothing. Without keystore.properties and
# google-services.json the build is debug-signed and Crashlytics stays inert,
# so the resulting APK is never uploaded or released.

on:
  # Disabled for now: it runs only when started by hand from the Actions tab.
  # To turn it back on, restore the push and pull_request triggers:
  #   push:
  #     branches: [main, "feat/**", "fix/**"]
  #   pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The full history is needed because versionCode is the git commit count.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testBetaUnitTest --no-daemon

      - name: Beta build (includes lint checks)
        run: ./gradlew assembleBeta --no-daemon

      - name: Keep test reports when the run fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore
