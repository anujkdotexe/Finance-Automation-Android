name: CI

# Runs the JVM unit tests and a beta build on push to main and fix/**, on pull requests and by hand.
# It uses no secrets and publishes nothing. Without keystore.properties and
# google-services.json the build is debug-signed and Crashlytics stays inert,
# so the resulting APK is never uploaded or released.

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The full history is needed because versionCode is the git commit count.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle with cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testBetaUnitTest --no-daemon

      - name: Create the debug keystore the beta signing config falls back to
        # Without keystore.properties the beta signing config uses the Android debug keystore,
        # and a clean runner has none. This creates a throwaway one (public debug credentials,
        # no secret) at the path the Android Gradle plugin reads.
        run: |
          KEYSTORE_DIR="${ANDROID_USER_HOME:-$HOME/.config/.android}"
          mkdir -p "$KEYSTORE_DIR"
          keytool -genkeypair -keystore "$KEYSTORE_DIR/debug.keystore" \
            -alias androiddebugkey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Beta build (includes lint checks)
        run: ./gradlew assembleBeta --no-daemon

      - name: Keep test reports when the run fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore

      - name: Keep lint reports and the R8 mapping file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-and-mapping
          path: |
            app/build/reports/lint-results-*.html
            app/build/outputs/mapping/**/mapping.txt
          if-no-files-found: ignore
